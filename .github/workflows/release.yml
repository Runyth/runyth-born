name: Release static bundles

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify the release tag matches the declared version
        run: |
          scripts/check-release-tag.sh "${GITHUB_REF_NAME}" "$(tr -d '[:space:]' < VERSION)"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")"
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build and package release
        run: make package

      - name: Install browser test tools
        run: npm ci && npx playwright install --with-deps chromium

      - name: Check static browser workflows
        run: npm run test:browser

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v7
        with:
          name: runyth-born-${{ github.ref_name }}
          path: release/*.zip
          if-no-files-found: error

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v3
        with:
          files: release/*.zip
          generate_release_notes: true
